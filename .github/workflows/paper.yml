name: Paper

on:
  pull_request:
    paths:
      - "paper/**"
      - "results/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  # Fast structural gate. Runs in seconds and catches a deleted or renamed input
  # before the slower build job spins up a TeX Live install.
  paper-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -f paper/main.tex
      - run: test -f paper/references.bib
      - run: test -f paper/tables/primary_results.tex
      - run: test -f paper/figures/README.md
      - run: test -f paper/figures/pipeline.tex
      - run: test -f paper/sections/10_appendix.tex
      - name: Every \input target must exist
        run: |
          set -euo pipefail
          # A `for` over command substitution, not a pipe into `while`: piping
          # runs the loop body in a subshell, so a variable set inside it is lost
          # when the loop ends, and the loop's exit status is that of its last
          # command -- which under `set -e` fails the step on a HEALTHY tree.
          #
          # Scans section sources as well as main.tex, so a nested \input is
          # resolved too.
          missing=0
          for target in $(grep -rho '\\input{[^}]*}' paper/main.tex paper/sections \
                          | sed 's/\\input{//; s/}//' | sort -u); do
            if [ ! -f "paper/${target}" ] && [ ! -f "paper/${target}.tex" ]; then
              echo "missing \\input target: ${target}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "one or more \\input targets are missing" >&2
            exit 1
          fi
          echo "all \\input targets resolve"

  # Real compilation. The structural job above only proves files exist; this
  # proves the manuscript actually builds, which is what "compiling paper
  # sections" in docs/weekly/WEEK_1.md requires.
  paper-build:
    runs-on: ubuntu-latest
    needs: paper-structure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TeX Live
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Build PDF
        working-directory: paper
        run: |
          set -euo pipefail
          # Two pdflatex passes around bibtex so \cite and \ref resolve.
          # -halt-on-error makes a LaTeX error fail the job instead of hanging
          # on the interactive prompt.
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main || echo "bibtex reported no citations yet; continuing"
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -f main.pdf

      - name: Report unresolved references
        working-directory: paper
        run: |
          set -uo pipefail
          # Informational, not blocking. Undefined references are expected while
          # result sections are still pending.
          grep -c "LaTeX Warning: Reference" main.log || true
          grep -c "LaTeX Warning: Citation" main.log || true

      - name: Report RESULT_PENDING markers
        run: |
          set -uo pipefail
          # docs/weekly/WEEK_4.md requires the FINAL pdf to carry no unresolved
          # RESULT_PENDING marker. That gate applies at submission, not today, so
          # this step reports the count without failing the build.
          count=$(grep -ro "RESULT\\\\\?_PENDING" paper/sections paper/tables | wc -l)
          echo "RESULT_PENDING markers remaining: ${count}"
          echo "These must be resolved before the submission tag (WEEK_4.md)."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pdf
          path: paper/main.pdf
          if-no-files-found: error

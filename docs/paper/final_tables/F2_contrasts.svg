<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 486" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Paired contrasts against the practical equivalence region">
<rect width="1140" height="486" fill="#fcfcfb"/>
<text x="44.0" y="40.0" text-anchor="start" fill="#0b0b0b" font-size="14" font-weight="600">Paired difference in NLL-regret AUC, with 95% intervals</text>
<text x="44.0" y="62.0" text-anchor="start" fill="#52514e" font-size="11" font-weight="normal">Each row is one policy minus another, paired by seed over five chains. Negative favours the first policy.</text>
<text x="44.0" y="80.0" text-anchor="start" fill="#52514e" font-size="11" font-weight="normal">The shaded band is the preregistered practical-equivalence region, ±0.0507 AUC units. An interval lying wholly inside it means the two policies are equivalent at this operating point.</text>
